<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta name="keywords" content="Slack, UI, Skeleton, Design, Chat">
    <meta name="author" content="Krushna Rathod">
    <meta property="og:title" content="Slack Skeleton UI">
    <meta property="og:description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/cover_slack.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Slack Skeleton UI">
    <meta name="twitter:description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta name="twitter:image" content="/images/cover_slack.jpg">
    <link rel="icon" href="icons/slack.svg">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <title>Slack Skeleton UI</title>
</head>
<body>
    <header class="header">
        <div id="header-buttons">
            <button id="close" title="close"></button>
            <button id="minimize" title="minimize"></button>
            <button id="resize" title="resize"></button>
        </div>
        <div id="header-searchbar-div">
            <button title="Recent Activity"><img src="/icons/clock.svg" alt="clock icon for recent Activity"></button>
            <input type="text" id="header-searchbar" placeholder="Search A1 Marketing Ltd.">
        </div>
        <div id="image-container">
            <img src="/images/header-image.png" alt="your profile image" id="profile-image">
            <div id="green-dot"></div>
        </div>
    </header>
    <div class="main-section">
        <aside class="aside">
            aside
        </aside>
        <main class="main">
            main
        </main>
    </div>
</body>
</html>
