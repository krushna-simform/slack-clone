<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta name="keywords" content="Slack, UI, Skeleton, Design, Chat">
    <meta name="author" content="Krushna Rathod">
    <meta property="og:title" content="Slack Skeleton UI">
    <meta property="og:description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/images/cover_slack.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Slack Skeleton UI">
    <meta name="twitter:description" content="Slack Skeleton UI - This Project is a single-page skeleton UI clone of slack's main conversation page.">
    <meta name="twitter:image" content="/images/cover_slack.jpg">
    <link rel="icon" href="/assets/icons/slack.svg">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <title>Slack Skeleton UI</title>
</head>
<body>
    <!-- Header section -->
    <header class="header">
        <div id="header-buttons">
            <button id="close" title="Close window" aria-label="close window"></button>
            <button id="minimize" title="Minimize window" aria-label="minimize window"></button>
            <button id="resize" title="Resize window" aria-label="resize window"></button>
        </div>

        <div id="header-searchbar-div">
            <button title="Recent activity" aria-label="View recent activity"><img src="/assets/icons/clock.svg" alt="clock icon for recent Activity"></button>
            <input type="text" id="header-searchbar" placeholder="Search A1 Marketing Ltd." aria-label="Search workplace">
        </div>

        <div id="image-container" tabindex="0" role="button" aria-label="Open profile settings">
            <img src="/assets/images/header-image.png" alt="profile image for your profile section" id="profile-image">
            <div id="green-dot" role="status" aria-label="online"></div>
        </div>
    </header>

    <!-- aside and main section  -->
    <div class="main-section">
        <aside class="aside" aria-label="Sidebar navigation">
            aside
        </aside>

        <main class="main" aria-label="Main content">
            main
        </main>
    </div>
</body>
</html>
